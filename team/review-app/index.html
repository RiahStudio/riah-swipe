  <link rel="stylesheet" href="styles/app.css?v=20260828growframe" />
  <title>Riah Swipe</title>
  <!-- Theme: same key as the site (rsw-theme); dark default. Inline so there is no flash. -->
  <script>
    (function () {
      var KEY = 'rsw-theme';
      function apply(theme) {
        var t = theme === 'light' ? 'light' : 'dark';
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
        else document.documentElement.removeAttribute('data-theme');
        try { localStorage.setItem(KEY, t); } catch (e) { /* ignore */ }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', t === 'light' ? '#FFFFFF' : '#0F0F11');
      }
      function current() {
        try { return localStorage.getItem(KEY) || 'dark'; } catch (e) { return 'dark'; }
      }
      apply(current());
      document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('[data-theme-toggle]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            apply(current() === 'light' ? 'dark' : 'light');
          });
        });
      });
    })();
  </script>
</head>
